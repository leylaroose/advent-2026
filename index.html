<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d27">
  <meta name="robots" content="noindex, nofollow">
  <title>Advent 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div class="sky" aria-hidden="true"></div>

  <header class="top">
    <svg class="ribbon" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
      <rect x="0" y="22" width="400" height="34" fill="var(--red)"/>
      <rect x="0" y="22" width="400" height="34" fill="url(#ribbonStripe)"/>
      <rect x="0" y="22" width="400" height="34" fill="none" stroke="var(--ink)" stroke-width="3"/>
      <defs>
        <pattern id="ribbonStripe" width="12" height="34" patternUnits="userSpaceOnUse">
          <rect width="12" height="34" fill="none"/>
          <rect x="0" y="6" width="12" height="3" fill="#ff8a8a" opacity=".5"/>
          <rect x="0" y="25" width="12" height="3" fill="#b8282e" opacity=".5"/>
        </pattern>
      </defs>
    </svg>
    <div class="lights" aria-hidden="true"></div>
    <svg class="bow" viewBox="0 0 220 170" aria-hidden="true">
      <g class="tail tail-l"><path d="M100 72 L58 160 L78 150 L86 168 L112 80 Z" fill="var(--red)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/></g>
      <g class="tail tail-r"><path d="M120 72 L162 160 L142 150 L134 168 L108 80 Z" fill="var(--red-dark)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/></g>
      <g class="loop loop-l"><path d="M104 62 C70 10 12 6 14 46 C16 84 70 84 104 66 Z" fill="var(--red)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><path d="M92 58 C66 30 34 28 32 46" fill="none" stroke="#ff9a9a" stroke-width="5" stroke-linecap="round" opacity=".8"/></g>
      <g class="loop loop-r"><path d="M116 62 C150 10 208 6 206 46 C204 84 150 84 116 66 Z" fill="var(--red)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><path d="M128 58 C154 30 186 28 188 46" fill="none" stroke="#ff9a9a" stroke-width="5" stroke-linecap="round" opacity=".8"/></g>
      <rect x="94" y="46" width="32" height="34" rx="10" fill="var(--red-dark)" stroke="var(--ink)" stroke-width="5"/>
    </svg>

    <div class="hero">
      <span class="pill">Advent 2026</span>
      <h1 class="title"><span>Für</span> <span id="recipient">Jan</span></h1>
      <p class="status" id="status"></p>
    </div>
  </header>

  <div class="board">
    <div class="fields" aria-hidden="true"><div class="field-a"></div><div class="field-b"></div></div>
    <main class="calendar" id="calendar" aria-label="Adventskalender"></main>
  </div>

  <footer class="hills" aria-hidden="true">
    <svg viewBox="0 0 400 150" preserveAspectRatio="none">
      <path d="M0 70 Q60 30 120 62 T250 54 T400 60 L400 150 L0 150Z" fill="#d9f3e3" stroke="var(--ink)" stroke-width="3"/>
      <path d="M0 100 Q90 70 190 98 T400 92 L400 150 L0 150Z" fill="#fff" stroke="var(--ink)" stroke-width="3"/>
    </svg>
    <div class="trees"></div>
    <p class="sign" id="sign">mit Liebe verpackt von Leyla</p>
  </footer>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-head">
      <span class="sheet-day" id="sheetDay"></span>
      <button class="close" id="closeSheet" aria-label="Schließen">✕</button>
    </div>
    <h2 class="sheet-title" id="sheetTitle"></h2>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <canvas id="fx" aria-hidden="true"></canvas>

  <script src="js/content.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/doors/basic.js"></script>
  <script src="js/doors/spezi.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
